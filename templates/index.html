{% extends "base.html" %}

{% block title %}
My Web Programming Portfolio
{% endblock %}

{% block content %}

<section>
    <h2>Weekly Work</h2>

    <ul>
        {% for item in weekly_work %}
            <li>
                <a href="{{ item.url }}">
                    Week {{ item.week }} — {{ item.title }}
                </a>
            </li>
        {% else %}
            <li>Week 1 — live site launched.</li>
        {% endfor %}
    </ul>

</section>

{% endblock %}
